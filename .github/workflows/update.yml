name: Update TRADER ARENA

on:
  workflow_dispatch:
  schedule:
    # 08:55 KST daily setup (23:55 UTC previous day)
    - cron: '55 23 * * 0-4'
    # Every 5 minutes during KST market hours (09:00-15:25)
    - cron: '*/5 0-6 * * 1-5'
    # Finalize after market close
    - cron: '35 6 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update prices and results
        run: python update_arena.py
      - name: Commit updated arena data
        run: |
          git config user.name "TRADER ARENA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arena.json
          git diff --cached --quiet || git commit -m "Update daily arena data"
          git push
