name: TRADER ARENA Daily Engine

on:
  workflow_dispatch:
  schedule:
    # 08:50 KST every weekday = 23:50 UTC previous day
    - cron: '50 23 * * 0-4'
    # Refresh every 5 minutes during KST regular market hours
    - cron: '*/5 0-6 * * 1-5'
    # Finalize after market close
    - cron: '35 6 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select and update arena
        run: python update_arena.py

      - name: Commit updated arena data
        run: |
          git config user.name "TRADER ARENA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arena.json
          git diff --cached --quiet || git commit -m "Update daily arena"
          git push
